  <style>/* CSS for leaflet map */

/* Tara likes Times */

* {
  font-family: "Times New Roman", Times, serif !important;
}

/* Button for centering on location */

.center-location-control {
  width: 120px;
  height: 120px;

  position: relative;
  display: block !important;

  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif !important;
  font-size: 115px;
  font-weight: 700;
  color: #fff;
  line-height: 1;

  background: #00000055;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  box-shadow: none;
  padding: 0;
  margin-bottom: 36px !important;
}

/* Crosshair itself */

.center-location-icon {
  position: absolute !important;
  left: 50% !important;
  top: 50% !important;

  transform: translate(-50%, -56%) !important;

  display: block;
  line-height: 1;
}
  
/* The following will only affect the output when used on a mobile device */

@media (hover: none) and (pointer:coarse) {
  
  /* Layer control panel and all text within it */
        
  .leaflet-control-layers {
    font-size: 24px;
    line-height: 2;
    padding: 8px 24px;
  }
  
  /* Bigger button for table of contents (layer control) */
  
  .leaflet-container .leaflet-control-layers-toggle,
  .leaflet-touch .leaflet-control-layers-toggle {
    width: 150px;
    height: 150px;
    background-size: 125px 125px;
  }
  
  /* The expanded layer-control panel */
  
  .leaflet-container .leaflet-control-layers-expanded,
  .leaflet-touch .leaflet-control-layers-expanded {
    font-size: 42px;
    line-height: 1.8;
    padding: 18px 36px;
  }
  
  /* Individual layer labels -- padding increases touch target height */
          
  .leaflet-container .leaflet-control-layers label,
  .leaflet-touch .leaflet-control-layers label {
    font-size: 80px;
    line-height: 1.8;
    padding: 10px 0;
    align-items: center;
  }
  
  /* Checkboxes and radio buttons -- larger for touch accuracy */
          
  .leaflet-container .leaflet-control-layers input[type='radio'],
  .leaflet-container .leaflet-control-layers input[type='checkbox'],
  .leaflet-touch .leaflet-control-layers input[type='radio'],
  .leaflet-touch .leaflet-control-layers input[type='checkbox'] {
    width: 80px;
    height: 80px;
    margin-right: 14px;
  }
  
  /* Separator line between base layers and overlay groups */
          
  .leaflet-control-layers-separator {
    margin: 8px 0;
  }
  
  /* Scale bar text and border */
          
  .leaflet-control-scale-line {
    font-size: 24px;
    line-height: 1.6;
    padding: 4px 10px;
    border-width: 2px;
  }
  
  /* Bigger zoom buttons */
  
  .leaflet-container .leaflet-control-zoom a,
  .leaflet-container .leaflet-touch .leaflet-control-zoom a,
  .leaflet-touch .leaflet-control-zoom a {
    width: 90px;
    height: 90px;
    line-height: 90px;
    font-size: 75px;
  }
  
  /* Smaller attribution */
  
  .leaflet-container .leaflet-control-attribution,
  .leaflet-touch .leaflet-control-attribution {
    font-size: 6px;
    line-height: 1;
    padding: 2px 4px;
  }
  
  /* Location accuracy label */

  .location-accuracy-control {
    font-size: 36px;
    font-weight: 700;
    line-height: 1.1;
    padding: 12px 18px;
    background: #ffffffe6;
    border: 2px solid #333;
    border-radius: 6px;
    box-shadow: none;
  }
  
  /* Leaflet scale bar: make it solid and more visible */
  
  .leaflet-control-scale-line {
    border: none;
    border-top: none;
    color: #fff;
    background: #0000ffa6;
    font-size: 36px;
    font-weight: 700;
    line-height: 1.2;
    padding: 4px 8px 6px 8px;
    box-shadow: none;
  }
  
  /* Button for centering on location */
  
  .center-location-control {
    width: 120px;
    height: 120px;
    
    position: relative;
    display: block;
    align-items: center;
    justify-content: center;
    
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif !important;
    font-size: 115px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    text-align: center;
    background: #00000055;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    box-shadow: none;
    padding: 0;
    margin-bottom: 36px !important;
  }
          
  /* Move the scale bar and accuracy text up north */
  
  .location-accuracy-control {
    transform: translate(25px, -50px);
  }
  
  .leaflet-control-scale {
    transform: translate(30px, -50px);
  }
}

/* Dealing with landscape view woes */

@media (hover: none) and (pointer: coarse) and (orientation: landscape) {
  
  /* Make sure the screen is still filled */
  
  html,
  body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100dvh !important;
    overflow: hidden !important;
  }

  .html-widget,
  .leaflet,
  .leaflet-container {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;

    width: 100vw !important;
    height: 100dvh !important;

    margin: 0 !important;
    padding: 0 !important;
  }
  
  main,
  .content,
  .page-layout-full,
  .quarto-container,
  .quarto-layout-panel,
  .cell-output-display {
    width: 100vw !important;
    max-width: none !important;
    height: 100vh !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* Expanded layer-control panel */
  
  .leaflet-container .leaflet-control-layers-expanded,
  .leaflet-touch .leaflet-control-layers-expanded {
    font-size: 24px;
    line-height: 1.25;
    padding: 10px 20px 10px 12px;

    max-height: calc(100vh - 24px);
    overflow-y: auto;
  }
  
  /* Smaller zoom buttons */
  
  .leaflet-container .leaflet-control-zoom a,
  .leaflet-container .leaflet-touch .leaflet-control-zoom a,
  .leaflet-touch .leaflet-control-zoom a {
    width: 40px;
    height: 40px;
    line-height: 40px;
    font-size: 30px;
  }

  /* Individual layer labels */
  
  .leaflet-container .leaflet-control-layers label,
  .leaflet-touch .leaflet-control-layers label {
    font-size: 32px;
    line-height: 1.25;
    padding: 4px 0;
  }

  /* Checkboxes and radio buttons */
  
  .leaflet-container .leaflet-control-layers input[type='radio'],
  .leaflet-container .leaflet-control-layers input[type='checkbox'],
  .leaflet-touch .leaflet-control-layers input[type='radio'],
  .leaflet-touch .leaflet-control-layers input[type='checkbox'] {
    width: 28px;
    height: 28px;
    margin-right: 8px;
  }

  /* Collapsed layer button */
  
  .leaflet-container .leaflet-control-layers-toggle,
  .leaflet-touch .leaflet-control-layers-toggle {
    width: 70px;
    height: 70px;
    background-size: 55px 55px;
  }
  
  /* Move the scale bar and accuracy text down south */
  
  .location-accuracy-control {
    transform: translateY(-5px);
  }
  
  .leaflet-control-scale {
    transform: translateY(-5px);
  }
  
  /* Location accuracy label */

  .location-accuracy-control {
    font-size: 24px;
    line-height: 1;
    padding: 10px 16px;
  }
  
  /* Leaflet scale bar: make it solid and more visible */
  
  .leaflet-control-scale-line {
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
    padding: 4px 8px 6px 8px;
  }
  
  /* The dastardly center location crosshairs */
  
  .center-location-control {
    width: 70px;
    height: 70px;
    font-size: 64px;
    line-height: 1;
    margin-bottom: 18px !important;
  }

  .center-location-icon {
    transform: translate(-50%, -56%) !important;
  }
}
</style>

\n      return window.orientation;\n    }\n    \n    // Sometimes (apparently) it is a screen.orientation.angle:\n    \n    if (\n    screen.orientation &&\n    typeof screen.orientation.angle === \"number\"\n    ) {\n      return screen.orientation.angle;\n    }\n    \n    // Sometimes the browser says it's in landscape, but doesn't provide a \n    // number (annoying!). In that case, we'll set the orietation based on\n    // the width and height of the window:\n    \n    if (window.innerWidth > window.innerHeight) {\n      return 90;\n    }\n  \n    // Otherwise, we'll assume that the phone is in portrait mode and facing\n    // forward, so we don't need to add a correction:\n  \n    return 0;\n  }\n  \n  // Centering:\n  \n  function centerOnLatestLocation() {\n    if (!latestLatLng) return;\n  \n    map.invalidateSize(false);\n  \n    map.setView(\n      latestLatLng,\n      map.getZoom(),\n      {\n        animate: false,\n        reset: true\n      }\n    );\n  }\n  \n  // Make sure the position of the arrow is still centered on rotation.\n  // Rotating phone orientations are a pain!\n  \n  function refreshMapSizeAndCenter() {\n    [100, 300, 600].forEach(function(delay) {\n      setTimeout(function() {\n        map.invalidateSize(false);\n      }, delay);\n    });\n  \n    // Recenter once, after the viewport has mostly settled.\n    setTimeout(function() {\n      centerOnLatestLocation();\n    }, 800);\n  }\n\n  window.addEventListener(\"resize\", refreshMapSizeAndCenter);\n  window.addEventListener(\"orientationchange\", refreshMapSizeAndCenter);\n  \n  // accuracy text control ------------------------------------------------\n\n  var accuracyControl = L.control({ position: \"bottomleft\" });\n  var accuracyDiv = null;\n\n  accuracyControl.onAdd = function(map) {\n    accuracyDiv = L.DomUtil.create(\n      \"div\",\n      \"leaflet-control location-accuracy-control\"\n    );\n\n    accuracyDiv.innerHTML = \"Accuracy: -- m\";\n    return accuracyDiv;\n  };\n\n  accuracyControl.addTo(map);\n  \n  // center on location button --------------------------------------------\n  \n  var centerControl = L.control({ position: \"bottomright\" });\n\n  centerControl.onAdd = function(map) {\n    var button = L.DomUtil.create(\n      \"button\",\n      \"leaflet-control center-location-control\"\n    );\n  \n    button.type = \"button\";\n    button.innerHTML = '<span class=\"center-location-icon\">&#8982;<\/span>';\n    button.title = \"Center on my location\";\n  \n    L.DomEvent.disableClickPropagation(button);\n    L.DomEvent.disableScrollPropagation(button);\n  \n    L.DomEvent.on(button, \"click\", function(e) {\n      L.DomEvent.stop(e);\n  \n      if (latestLatLng) {\n        centerOnLatestLocation();\n      } else {\n        map.locate({\n          setView: true,\n          enableHighAccuracy: true,\n          maxZoom: map.getZoom()\n        });\n      }\n    });\n    \n    return button;\n  };\n\n  centerControl.addTo(map);\n\n  // location tracking ----------------------------------------------------\n\n  map.locate({\n    watch: true,\n    enableHighAccuracy: true\n  });\n\n  map.on('locationfound', function(e) {\n    latestLatLng = e.latlng;\n    \n    if (firstFix) {\n      refreshMapSizeAndCenter();\n      firstFix = false;\n    }\n    \n    // Update accuracy text\n\n    if (accuracyDiv) {\n      accuracyDiv.innerHTML =\n        \"Accuracy: \" + Math.round(e.accuracy) + \" m\";\n    }\n    \n    /* Add an accuracy circle */\n\n    if (accuracyCircle) {\n      accuracyCircle.setLatLng(e.latlng).setRadius(e.accuracy);\n    } else {\n      accuracyCircle = L.circle(e.latlng, {\n        radius: e.accuracy,\n        color: '#136aec',\n        fillColor: '#136aec',\n        fillOpacity: 0.15,\n        weight: 1,\n        interactive: false\n      }).addTo(map);\n    }\n\n    // The arrow serves as the position marker -- created on the first GPS\n    // fix and repositioned on every subsequent fix. Rotation is handled\n    // separately by handleOrientation below.\n\n    if (headingMarker) {\n      headingMarker.setLatLng(e.latlng);\n    } else {\n      headingMarker = L.marker(e.latlng, {\n        icon: L.divIcon({\n          html: '<svg class=\"heading-arrow\" viewBox=\"0 0 40 40\"' +\n            ' width=\"80\" height=\"80\" xmlns=\"http://www.w3.org/2000/svg\">' +\n            '<g class=\"heading-group\">' +\n              '<polygon points=\"20,4 34,36 20,27 6,36\"' +\n                ' fill=\"#136aec\" stroke=\"white\"' +\n                ' stroke-width=\"1.5\" stroke-linejoin=\"round\"/>' +\n            '<\/g>' +\n          '<\/svg>',\n          className: '',\n          iconSize: [80, 80],\n          iconAnchor: [40, 40]\n        }),\n        interactive: false,\n        zIndexOffset: 1000\n      }).addTo(map);\n    }\n  });\n\n  map.on('locationerror', function(e) {\n    console.warn('Location error: ' + e.message);\n  });\n\n  // compass heading ------------------------------------------------------\n\n  // Position is managed by locationfound, so setHeading only needs to update\n  // the rotation of the existing marker.\n\n  function setHeading(degrees) {\n    if (!headingMarker) return;\n    var markerEl = headingMarker.getElement();\n    if (markerEl) {\n      var g = markerEl.querySelector('.heading-group');\n      if (g) {\n      g.setAttribute('transform', 'rotate(' + degrees + ', 20, 20)');\n      }\n    }\n  }\n  \n  // This will use the actual orientation if in portrait mode or define based\n  // on the direction of the screen if they are not the same.\n\n  function handleOrientation(event) {\n    var heading;\n  \n    if (typeof event.webkitCompassHeading === \"number\") {\n      heading = event.webkitCompassHeading;\n    } else if (event.absolute && typeof event.alpha === \"number\") {\n      heading = (360 - event.alpha) % 360;\n    } else {\n      return;\n    }\n  \n    var correctedHeading =\n      (heading - getScreenAngle() + 360) % 360;\n  \n    setHeading(c
