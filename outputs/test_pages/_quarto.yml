project:
  type: website
  output-dir: docs
  post-render: scripts/make_field_map.R
  resources:
    - scripts/accordion.js
    - scripts/map_tracking.js

website:
  title: "**Snedgen Nest Study**"
  search: false
  navbar:
    left:
      - text: "Schedule"
        file: index.qmd
      - text: "Species info"
        file: species_info.qmd
      - text: "Field map"
        file: field_map.qmd
      - text: "Nests"
        file: nests.qmd

format:
  html:
    theme: cosmo
    toc: false
    css: my_style.css
    include-after-body:
      text: |
        <script src="scripts/accordion.js"></script>

execute:
  echo: false
  warning: false
  message: false