name: Daily weather push

# Fetch the NWS forecast and push per-date weather JSON to the API weather table.
# The schedule itself is now DB views (check_nests, predator_cameras derived
# live), so weather is the only recurring job -- and it needs no DB or SSH
# access, just the public NWS API and the app API token.

on:
  schedule:
    - cron: "59 3 * * *"
  workflow_dispatch:

jobs:
  weather:
    runs-on: ubuntu-latest

    # rocker/geospatial ships R + sf/GDAL + tidyverse, so only a few light
    # packages install at run time.
    container:
      image: rocker/geospatial:latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Mark the workspace safe for git (container runs as root)
        run: git config --global --add safe.directory '*'

      - name: Install the extra R packages not already in the image
        run: |
          Rscript -e '
            pkgs <- c("here", "glue", "jsonlite", "httr")
            need <- setdiff(pkgs, rownames(installed.packages()))
            if (length(need)) install.packages(need, repos = "https://packagemanager.posit.co/cran/__linux__/jammy/latest")
          '

      - name: Fetch the forecast and push it to the weather table
        run: Rscript scripts/db/weather_push.R
